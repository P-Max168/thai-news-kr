# ✍️ 제미나이 판 만들기(2026-10-25 Claude). 14:44 맥스님 결정 '모든 뉴스판 구조 통일' — 정해진 시각에 코드가 후보를 고르고(tools/code_picks.py)
#   제미나이가 그중 최대 10건을 골라 원고를 씀(베트남판·KSTAR 와 같은 방식, 그록 토큰 0). 그록은 감시만. ops/picks/<판 id>.json 을 손으로 올려도 그대로 돎.
# 흐름:
#   후보 목록 받기 → tools/gemini_edition.py(원문 본문 + 제미나이 1회 호출 → 검증·저장) → share_kit(공유 카드) → tools/deploy.sh(담당 확인·커밋·push·Pages 확인)
# 키: 저장소 Secret GEMINI_API_KEY(맥스님 등록). 없으면 판을 만들지 않고 실패로 끝남 → Claude 비상 발행이 30분 뒤 이어받음.
# 손으로 다시 돌리기: Actions → gemini-edition → Run workflow → 판 id.
name: gemini-edition

on:
  schedule:
    # 2026-10-27 맥스님: 하루 3판. 그록 picks push 가 우선, 예약은 못 올렸을 때 대비(코드 고르기)
    - cron: "5 0 * * *"     # 07:05 BKK 아침판(am) 대비 — picks 06:40
    - cron: "5 5 * * *"     # 12:05 BKK 점심판(md) 대비 — picks 11:40
    - cron: "5 11 * * *"    # 18:05 BKK 저녁판(pm) 대비 — picks 17:40
  push:
    branches: [main]
    paths: ["ops/picks/*.json"]
  workflow_dispatch:
    inputs:
      edition:
        description: "판 id (예: 2026-10-26-am) — ops/picks/<id>.json 이 있어야 함"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: gemini-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 의존성
        if: steps.ed.outputs.skip != '1'
        run: pip install --quiet requests beautifulsoup4 playwright==1.55.0
      - name: 공유 카드용 브라우저(실패해도 판은 나감)
        if: steps.ed.outputs.skip != '1'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: 후보 목록(candidates 브랜치) — 코드 고르기·제목 채우기에 씀
        continue-on-error: true
        run: |
          mkdir -p drafts/candidates
          git fetch -q origin +candidates:refs/remotes/origin/candidates && git show origin/candidates:candidates/latest.json > drafts/candidates/latest.json
      - name: 판 id 찾기
        id: ed
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ -n "${{ inputs.edition }}" ]; then id="${{ inputs.edition }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            h=$((10#$(date +%H)))
            if [ "$h" -lt 10 ]; then s=am; elif [ "$h" -lt 15 ]; then s=md; else s=pm; fi
            id="$(date +%F)-$s"
            if [ -f "data/$id.json" ]; then echo "이미 있음: $id — 할 일 없음"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            # 키가 없거나(맥스님 등록 전) 임시 발행 담당(ops/publisher.json, 예: Codex ~10-26 12:45)이 있으면 담당 표시를 하지 않고 비켜 줌 — 다른 발행자를 막지 않게
            if [ "$HAS_KEY" != "true" ]; then echo "::notice::GEMINI_API_KEY 없음 — 자동 판 건너뜀(비상 발행이 메움)"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            # 그록·Claude 가 이미 담당 표시(claim/<판 id>/…)를 했으면 그쪽이 맡은 것 → 대비 예약은 비켜 줌
            if [ -n "$(git ls-remote origin "refs/heads/claim/$id/*")" ]; then echo "::notice::담당 표시 있음 — 대비 예약 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            TNK_PUBLISHER=grok python3 tools/publisher_guard.py || { echo "::notice::임시 발행 담당 기간 — 자동 판 건너뜀"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
            [ -f "ops/picks/$id.json" ] || python3 tools/code_picks.py "$id" || { echo "코드 고르기 실패(후보 부족) — 비상 발행이 이어받음"; exit 3; }
          else id=$(git diff --name-only HEAD~1 HEAD -- 'ops/picks/*.json' | tail -1 | sed -E 's#ops/picks/(.*)\.json#\1#')
            # 그록이 고르기 파일을 다시 올려도 이미 나간 판은 다시 만들지 않음(겹침 방지). 다시 만들려면 Run workflow 로 판 id 지정
            if [ -n "$id" ] && [ -f "data/$id.json" ]; then echo "이미 있음: $id — 할 일 없음"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          [ -n "$id" ] && [ -f "ops/picks/$id.json" ] || { echo "picks 파일 없음: $id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "판: $id"
      - name: 담당 표시(그록) — Claude 가 이미 비상 발행을 시작했으면 HOLD 로 멈춤(중복 방지)
        if: steps.ed.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/edition_claim.py claim grok "${{ steps.ed.outputs.id }}"
      - name: 제미나이 원고 → 검증·저장
        if: steps.ed.outputs.skip != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2026-10-28 Max: lite 주 모델(RPD≈500). 3.8은 폴백 1회. 되돌리기: 두 줄을 지우거나 3.8/lite로 맞바꾸기.
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.8-flash
        run: python3 tools/gemini_edition.py "${{ steps.ed.outputs.id }}" "ops/picks/${{ steps.ed.outputs.id }}.json"
      - name: 공유 카드
        if: steps.ed.outputs.skip != '1'
        continue-on-error: true
        run: python3 tools/share_kit.py "${{ steps.ed.outputs.id }}"
      - name: 배포(담당 확인·커밋·push·Pages 빌드 확인)
        if: steps.ed.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TNK_PUBLISHER: grok
          TNK_LIVE_CHECK: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/gemini-usage.jsonl ops/gemini-spend.json 2>/dev/null || true
          bash tools/deploy.sh
      - name: 실패 기록만 커밋(edition-fail·usage) — Claude 비상 발행용
        if: failure() && steps.ed.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ops
          eid="${{ steps.ed.outputs.id }}"
          if [ ! -f ops/edition-fail.json ]; then
            printf '%s\n' "{\"at\":\"$(TZ=Asia/Bangkok date +%Y-%m-%dT%H:%M:%S+07:00)\",\"edition\":\"${eid}\",\"error\":\"workflow_failure_no_edition_fail_file\"}" > ops/edition-fail.json
          fi
          git add ops/edition-fail.json ops/gemini-usage.jsonl ops/gemini-spend.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "커밋할 실패 기록 없음"; exit 0; fi
          git commit -m "ops: edition-fail ${eid} (gemini 실패 기록)" || exit 0
          git fetch -q origin main
          ok=""
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q origin main || { echo "rebase 재시도 $i"; sleep $((i * 3)); continue; }
            if git push origin HEAD:main; then ok=1; break; fi
            echo "fail-record push 재시도 $i"; sleep $((i * 5))
          done
          if [ -z "$ok" ]; then echo "::warning::edition-fail push 실패 — Actions 로그로 Claude가 확인 가능"; fi
          exit 0

