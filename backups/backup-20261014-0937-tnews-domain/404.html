<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>페이지를 찾을 수 없어요 · 태국 뉴스 한눈에</title>
<!-- GitHub Pages 404(2026-10-03 다듬기): 어느 깊이의 주소에서든 보이므로 링크는 사이트 첫 경로(/thai-news-kr/)로 계산. 외부 파일 없음 -->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F2F4F6;color:#191F28;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.box{max-width:360px;width:100%;background:#fff;border-radius:20px;padding:30px 20px 20px;text-align:center}
.ic{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#E8F3FF;color:#1B64DA}
.ic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.25rem;margin:14px 0 6px;letter-spacing:-.4px}
p{margin:0 0 18px;color:#4E5968;font-size:.9375rem}
a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font-weight:700;text-decoration:none;background:#1B64DA;color:#fff}
</style>
</head>
<body>
<main class="box">
  <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /></svg></div>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 지워진 페이지예요. 오늘의 뉴스로 가 볼까요?</p>
  <a id="home" href="/thai-news-kr/">오늘의 뉴스 보기</a>
</main>
<script>
(function () { var seg = location.pathname.split("/")[1]; if (seg && !/\./.test(seg) && location.hostname.slice(-10) === "github.io") document.getElementById("home").href = "/" + seg + "/"; else if (location.hostname.slice(-10) !== "github.io") document.getElementById("home").href = "/"; })();
</script>
</body>
</html>
