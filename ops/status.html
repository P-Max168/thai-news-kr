<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>뉴스 채널 현황판</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mute:#6b7383;--line:#e3e6ec;--ok:#1f8a4c;--okbg:#e6f5ec;--warn:#a86400;--warnbg:#fff3df;--bad:#c0362c;--badbg:#fde8e6;--idle:#6b7383;--idlebg:#eef0f3}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e8ebf1;--mute:#98a1b3;--line:#2b3240;--ok:#5fd18f;--okbg:#17321f;--warn:#f0b450;--warnbg:#3a2a10;--bad:#ff7b70;--badbg:#3d1b18;--idle:#98a1b3;--idlebg:#252b36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700}
.name a{color:inherit;text-decoration:none}
.meta{color:var(--mute);font-size:13px}
.rows{margin-top:10px;display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:6px}
.row span:first-child{color:var(--mute);flex:0 0 auto}
.row span:last-child{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.ok{color:var(--ok);background:var(--okbg)}.warn{color:var(--warn);background:var(--warnbg)}.bad{color:var(--bad);background:var(--badbg)}.idle{color:var(--idle);background:var(--idlebg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer}
a{color:inherit}
</style>
</head>
<body>
<main>
<div class="head"><h1>뉴스 채널 현황판</h1><button id="re">새로고침</button></div>
<div class="sub" id="sub">불러오는 중…</div>
<div id="banner" class="banner idle">확인 중…</div>
<div id="list"></div>
</main>
<script>
// 2026-10-24 Claude. 채널 목록 = ops/channels.json. 읽기만 함(GitHub 공개 API·raw, 토큰 없음 — 시간당 60회 제한이라 5분마다 갱신).
const BKK = 7 * 3600e3;
const bkk = d => new Date(d.getTime() + BKK);
const today = () => bkk(new Date()).toISOString().slice(0, 10);
const nowHM = () => bkk(new Date()).toISOString().slice(11, 16);
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 60 ? m + "분 전" : m < 1440 ? Math.floor(m / 60) + "시간 " + (m % 60) + "분 전" : Math.floor(m / 1440) + "일 전"; };
const hm = t => bkk(new Date(t)).toISOString().slice(5, 16).replace("T", " ");
const pill = (cls, txt) => `<span class="pill ${cls}">${txt}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
async function j(u) { const r = await fetch(u, {cache: "no-store"}); if (!r.ok) throw new Error(r.status); return r.json(); }
const raw = (repo, branch, path) => `https://raw.githubusercontent.com/${repo}/${branch}/${path}?t=${Date.now()}`;

async function channel(c) {
  const out = {c, rows: [], level: 0};   // level 0 ok, 1 warn, 2 bad
  const bump = l => out.level = Math.max(out.level, l);
  if (c.status !== "live") { out.rows.push(["상태", pill("idle", "준비 중")]); out.level = -1; return out; }
  // 1) 판
  try {
    const idx = await j(raw(c.repo, "main", "data/index.json"));
    const ids = new Set((idx.editions || []).map(e => e.id).concat(idx.dates || []));
    const last = (idx.editions || []).find(e => e.id === idx.latest) || {};
    out.rows.push(["최신 판", `${esc(idx.latest)} · ${last.stories ?? "?"}건 · ${last.generated ? ago(last.generated) : ""}`]);
    for (const e of c.editions) {
      const id = today() + "-" + e.slot;
      let s;
      if (ids.has(id)) s = pill("ok", "발행됨");
      else if (nowHM() < e.due) s = pill("idle", e.due + "까지 대기");
      else { s = pill("bad", "늦음 (기한 " + e.due + ")"); bump(2); }
      out.rows.push(["오늘 " + e.slot, s]);
    }
  } catch (err) { out.rows.push(["판", pill("bad", "읽기 실패 " + esc(err.message))]); bump(2); }
  // 2) 후보 수집
  if (c.candidates) {
    const tryMeta = async src => j(raw(src.repo, src.branch, "meta.json")).then(m => ({m, src}));
    let got = null;
    try { got = await tryMeta(c.candidates); } catch (e) { if (c.candidates.fallback) { try { got = await tryMeta(c.candidates.fallback); } catch (e2) {} } }
    if (got) {
      const h = (Date.now() - new Date(got.m.collected_at)) / 3600e3;
      const fb = got.src !== c.candidates ? " (대체: " + got.src.repo.split("/")[1] + ")" : "";
      const cls = h > c.candidates.max_age_h ? "warn" : "ok";
      if (cls === "warn") bump(1);
      out.rows.push(["후보 수집", `${pill(cls, ago(got.m.collected_at))} ${got.m.items ?? "?"}건 · 소스 ${got.m.sources_ok ?? "?"}${fb}`]);
    } else { out.rows.push(["후보 수집", pill("warn", "없음")]); bump(1); }
  }
  // 3) 자동 작업(최근 실행 중 작업별 마지막 결과)
  try {
    const runs = (await j(`https://api.github.com/repos/${c.repo}/actions/runs?per_page=30`)).workflow_runs || [];
    const lastBy = {};
    for (const r of runs) if (!lastBy[r.name]) lastBy[r.name] = r;
    const bad = Object.values(lastBy).filter(r => r.conclusion && !["success", "skipped", "cancelled"].includes(r.conclusion));
    if (bad.length) { bump(1); out.rows.push(["자동 작업", bad.map(r => pill("warn", esc(r.name) + " 실패")).join(" ")]); }
    else out.rows.push(["자동 작업", pill("ok", Object.keys(lastBy).length + "개 정상")]);
    const issues = await j(`https://api.github.com/repos/${c.repo}/issues?state=open&labels=edition-gap`);
    if (issues.length) { bump(2); out.rows.push(["공백 경보", issues.map(i => `<a href="${i.html_url}">${pill("bad", "#" + i.number)}</a>`).join(" ")]); }
  } catch (err) { out.rows.push(["자동 작업", pill("idle", "확인 못 함(" + esc(err.message) + ")")]); }
  return out;
}

async function load() {
  document.getElementById("sub").textContent = "불러오는 중…";
  let cfg;
  try { cfg = await j("channels.json?t=" + Date.now()); } catch (e) { document.getElementById("banner").textContent = "채널 목록(channels.json)을 못 읽음"; return; }
  const res = await Promise.all(cfg.channels.map(channel));
  const worst = Math.max(...res.map(r => r.level));
  const b = document.getElementById("banner");
  b.className = "banner " + (worst >= 2 ? "bad" : worst === 1 ? "warn" : "ok");
  b.textContent = worst >= 2 ? "확인 필요: 늦거나 실패한 판이 있습니다" : worst === 1 ? "주의: 수집이 오래됐거나 자동 작업 실패가 있습니다" : "모든 운영 채널 정상";
  const st = l => l < 0 ? pill("idle", "준비 중") : l >= 2 ? pill("bad", "문제") : l === 1 ? pill("warn", "주의") : pill("ok", "정상");
  document.getElementById("list").innerHTML = res.map(r => `
    <section class="card">
      <div class="head"><div class="name"><a href="${r.c.site}">${esc(r.c.name)}</a></div>${st(r.level)}</div>
      <div class="meta">${esc(r.c.publisher)}${r.c.repo ? " · " + esc(r.c.repo) : ""}</div>
      <div class="rows">${r.rows.map(x => `<div class="row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div>
    </section>`).join("");
  document.getElementById("sub").textContent = "방콕 " + today() + " " + nowHM() + " 기준 · 5분마다 자동 갱신";
}
document.getElementById("re").onclick = load;
load(); setInterval(load, 5 * 60e3);
</script>
</body>
</html>
