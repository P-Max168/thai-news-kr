<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2a4a">
<title>인터넷 연결 없음 · 태국 뉴스 한눈에</title>
<!-- 오프라인 안내(2026-10-03 앱 포장 준비): 서비스 워커가 캐시해 두고, 저장해 둔 페이지가 없을 때 대신 보여 줌. 외부 파일 없이 이 파일 하나로 동작 -->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1d2433;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.box{max-width:360px;width:100%;background:#fff;border-radius:18px;padding:26px 20px 20px;text-align:center;box-shadow:0 2px 10px rgba(16,24,40,.08)}
.ic{font-size:2.75rem;line-height:1}
h1{font-size:1.25rem;margin:12px 0 6px}
p{margin:0 0 18px;color:#4b5565;font-size:.9375rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
button{border:0;background:#0b2a4a;color:#fff}
a{border:1px solid #cfd6e1;color:#0b2a4a;background:#fff}
</style>
</head>
<body>
<main class="box">
  <div class="ic" aria-hidden="true">📡</div>
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>연결되면 다시 시도해 주세요. 전에 본 뉴스는 '뉴스 보기'에서 그대로 읽을 수 있어요.</p>
  <div class="btns"><button type="button" onclick="location.reload()">다시 시도</button><a href="./">뉴스 보기</a></div>
</main>
</body>
</html>
