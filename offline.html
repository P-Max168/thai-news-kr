<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>인터넷 연결 없음 · 태국 뉴스 한눈에</title>
<!-- 오프라인 안내(2026-10-03 앱 포장 준비): 서비스 워커가 캐시해 두고, 저장해 둔 페이지가 없을 때 대신 보여 줌. 외부 파일 없이 이 파일 하나로 동작 -->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F2F4F6;color:#191F28;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.box{max-width:360px;width:100%;background:#fff;border-radius:20px;padding:30px 20px 20px;text-align:center}
.ic{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#E8F3FF;color:#1B64DA}
.ic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.25rem;margin:14px 0 6px;letter-spacing:-.4px}
p{margin:0 0 18px;color:#4E5968;font-size:.9375rem}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
button{border:0;background:#1B64DA;color:#fff}
a{border:0;color:#191F28;background:#F2F4F6}
</style>
</head>
<body>
<main class="box">
  <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" /><path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" /><path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" /></svg></div>
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>연결되면 다시 시도해 주세요. 전에 본 뉴스는 '뉴스 보기'에서 그대로 읽을 수 있어요.</p>
  <div class="btns"><button type="button" onclick="location.reload()">다시 시도</button><a href="./">뉴스 보기</a></div>
</main>
</body>
</html>
